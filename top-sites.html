<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Sites - TabPilse</title>
    <link rel="stylesheet" href="i18n.js">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .content {
            padding: 20px;
        }

        .top-sites-list {
            list-style: none;
        }

        .site-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.2s ease;
        }

        .site-item:hover {
            background: #f9f9f9;
        }

        .site-item:last-child {
            border-bottom: none;
        }

        .rank {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 50%;
            font-weight: 700;
            margin-right: 15px;
            font-size: 14px;
        }

        .rank.top3 {
            font-size: 20px;
        }

        .rank.first {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
        }

        .rank.second {
            background: linear-gradient(135deg, #C0C0C0 0%, #808080 100%);
        }

        .rank.third {
            background: linear-gradient(135deg, #CD7F32 0%, #8B4513 100%);
        }

        .site-info {
            flex: 1;
        }

        .site-domain {
            font-weight: 600;
            color: #333;
            word-break: break-all;
            font-size: 14px;
        }

        .site-visits {
            color: #999;
            font-size: 12px;
            margin-top: 4px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state p {
            font-size: 14px;
            margin-bottom: 10px;
        }

        .footer {
            background: #f9f9f9;
            padding: 15px 20px;
            text-align: center;
            font-size: 12px;
            color: #999;
            border-top: 1px solid #f0f0f0;
        }

        body.dark-mode {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        body.dark-mode .container {
            background: #2d2d44;
            color: #e0e0e0;
        }

        body.dark-mode .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        body.dark-mode .site-item:hover {
            background: #353555;
        }

        body.dark-mode .site-domain {
            color: #e0e0e0;
        }

        body.dark-mode .site-visits {
            color: #999;
        }

        body.dark-mode .footer {
            background: #252540;
            border-top-color: #353555;
            color: #666;
        }

        body.dark-mode .empty-state {
            color: #666;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 8px 16px;
            background: #f0f0f0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            color: #333;
            transition: background 0.2s ease;
        }

        .back-btn:hover {
            background: #e0e0e0;
        }

        body.dark-mode .back-btn {
            background: #353555;
            color: #e0e0e0;
        }

        body.dark-mode .back-btn:hover {
            background: #454575;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 data-i18n="topSitesTitle">Top 10 Sites</h1>
            <p data-i18n="topSitesSubtitle">Vos sites les plus visités</p>
        </div>

        <div class="content">
            <button class="back-btn" onclick="window.history.back()">← Retour</button>
            <ol class="top-sites-list" id="sitesList">
                <!-- The sites will be displayed here -->
            </ol>
            <div class="empty-state" id="emptyState" style="display: none;">
                <p data-i18n="noData">Aucune donnée disponible</p>
            </div>
        </div>

        <div class="footer">
            <p data-i18n="privacyNote">✓ Données jamais enregistrées</p>
        </div>
    </div>

    <script src="i18n.js"></script>
    <script src="top-sites.js"></script>
</body>
</html>
